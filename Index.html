<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calcuraptor</title>
    <link rel="stylesheet" href="styles.css">
</head>
<header>
    <h1>Calcuraptor</h1>
</header>
<body>
    <div class="contenedor">
        <h2>Bienvenido a la Calcuraptora</h2>
        <h4>Calcula fácil el costo de tu compra.</h4>
        <p>Ingrese su nombre para atendendolo con toda la amabilidad.</p>
        <input type="text" id="nombre" placeholder="Ingrese su nombre">
        <button onclick="atenderCliente()">Atender</button>
    </div>
    <div class="contenedor" id="saludoContainer" style="display: none;">
        <h3 id="saludo">Buenos dias, <span id="nombreMostrado"></span>!</h3>
    </div>
    <div class="contenedor">
        <h2>Calculadora de Compras</h2>
        <p>Ingrese el precio del producto:</p>
        <input type="number" id="precio" placeholder="Precio del producto">
        <p>Ingrese la cantidad de productos:</p>
        <input type="number" id="cantidad" placeholder="Cantidad de productos (enteros por favorcito)">
        <button onclick="calcularCosto()">Calcular Total</button>
        <output id="resultado" aria-live="polite"></output>
    </div>
    <script src="script.js"></script>
    <script>
        function atenderCliente() {
            const nombre = document.getElementById('nombre').value.trim();
            document.getElementById('nombreMostrado').textContent = nombre || 'cliente';
            document.getElementById('saludoContainer').style.display = 'block';
        }

        function calcularCosto() {
            const precio = Number(document.getElementById('precio').value);
            const cantidad = Number(document.getElementById('cantidad').value);
            const resultado = document.getElementById('resultado');

            if (!Number.isFinite(precio) || precio <= 0 || !Number.isInteger(cantidad) || cantidad <= 0) {
                resultado.textContent = 'Ingrese un precio y una cantidad válida.';
                return;
            }

            resultado.textContent = `Total: Q ${(precio * cantidad).toFixed(2)}`;
        }
    </script>
</body>
</html>
